kind = "web"
previewPath = "/"
title = "Bouchée Fine"
description = "A responsive French fine food brand landing page for Bouchée Fine. It showcases the brand's passion for culinary heritage with a stunning hero layout, golden gradient typography, and social links — targeting both private and corporate clients seeking authentic French cuisine."
version = "1.0.0"
id = "artifacts/figma-design"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24154

[services.development]
run = "pnpm --filter @workspace/figma-design run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/figma-design", "run", "build" ]
serve = "static"
publicDir = "artifacts/figma-design/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24154"
BASE_PATH = "/"
